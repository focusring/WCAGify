packages:
  - packages/*
  - playground
  - docs

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  vue-demi: false

catalog:
  '@nuxt/fonts': ^0.14.0
  '@nuxt/ui': ^4.9.0
  '@tiptap/core': ^3.27.4
  '@tiptap/vue-3': ^3.27.4
  nanoid: ^6.0.0
  sharp: ^0.35.3
  zod: ^4.4.3

catalogMode: prefer

catalogs:
  cli:
    '@clack/prompts': ^1.7.0
    commander: ^15.0.0
    ejs: ^6.0.1
    picocolors: ^1.1.1
  core:
    '@iconify-json/lucide': ^1.2.117
    '@iconify-json/simple-icons': ^1.2.90
    '@libsql/client': ^0.17.4
    '@nuxt/a11y': 1.0.0-alpha.1
    '@nuxt/content': ^3.15.0
    '@nuxt/icon': ^2.3.1
    '@nuxt/kit': ^4.4.8
    '@nuxt/ui': ^4.9.0
    '@nuxtjs/i18n': ^10.4.1
    '@vueuse/core': ^14.3.0
    nuxt: ^4.4.8
    nuxt-studio: ^1.7.0
    tailwindcss: ^4.3.2
    zod: ^4.4.3
  dev:
    '@nuxt/schema': ^4.4.8
    '@types/ejs': ^3.1.5
    '@types/node': ^24.13.3
    '@vitest/coverage-v8': ^4.1.10
    bumpp: ^11.1.0
    changelogen: ^0.6.2
    changelogithub: ^14.0.0
    husky: ^9.1.7
    knip: ^6.26.0
    lint-staged: ^17.0.8
    oxfmt: ^0.59.0
    oxlint: ^1.74.0
    playwright: ^1.61.1
    tsdown: ^0.22.8
    typescript: ^6.0.3
    unpdf: ^1.6.2
    vitest: ^4.1.10
    vue-tsc: ^3.3.7
  docs:
    '@tailwindcss/vite': ^4.3.2
    vitepress: 2.0.0-alpha.18

linkWorkspacePackages: true

shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - chokidar
  - semver
  - undici-types
