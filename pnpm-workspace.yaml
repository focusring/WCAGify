packages:
  - packages/*
  - playground
  - docs

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  vue-demi: false

catalog:
  '@nuxt/fonts': ^0.14.0
  '@nuxt/ui': ^4.10.0
  '@tiptap/core': ^3.29.2
  '@tiptap/vue-3': ^3.29.2
  nanoid: ^6.0.0
  sharp: ^0.35.3
  zod: ^4.4.3

catalogMode: prefer

catalogs:
  cli:
    '@clack/prompts': ^1.7.0
    commander: ^15.0.0
    ejs: ^6.0.1
    picocolors: ^1.1.1
  core:
    '@iconify-json/lucide': ^1.2.120
    '@iconify-json/simple-icons': ^1.2.92
    '@libsql/client': ^0.17.4
    '@nuxt/a11y': 1.0.0-alpha.1
    '@nuxt/content': ^3.15.2
    '@nuxt/icon': ^2.4.1
    '@nuxt/kit': ^4.5.2
    '@nuxt/ui': ^4.10.0
    '@nuxtjs/i18n': ^10.6.0
    '@vueuse/core': ^14.4.0
    nuxt: ^4.5.2
    nuxt-studio: ^1.7.0
    tailwindcss: ^4.3.3
    zod: ^4.4.3
  dev:
    '@nuxt/schema': ^4.5.2
    '@types/ejs': ^3.1.5
    '@types/node': ^24.13.3
    '@vitest/coverage-v8': ^4.1.10
    bumpp: ^12.2.0
    changelogen: ^0.6.2
    changelogithub: ^15.0.4
    husky: ^9.1.7
    knip: ^6.30.0
    lint-staged: ^17.2.0
    oxfmt: ^0.61.0
    oxlint: ^1.76.0
    playwright: ^1.62.1
    tsdown: ^0.22.14
    typescript: ^6.0.3
    unpdf: ^1.8.0
    vitest: ^4.1.10
    vue-tsc: ^3.3.9
  docs:
    '@tailwindcss/vite': ^4.3.3
    vitepress: 2.0.0-alpha.18

linkWorkspacePackages: true

# @nuxt/ui declares its Tiptap packages as ^3 peers; pnpm auto-installed them
# at 3.26.0 (stale lockfile resolutions) while the catalog pins core/vue-3 to
# ^3.27.4. Tiptap packages exact-pin their peers to their own version, so a
# mixed tree breaks peer resolution and duplicates @tiptap/pm. Keep the whole
# tree on one version, and keep this range in sync with the catalog.
# (Enumerated because pnpm ignores wildcard override names like '@tiptap/*'.)
overrides:
  '@tiptap/extension-blockquote': ^3.29.2
  '@tiptap/extension-bold': ^3.29.2
  '@tiptap/extension-bullet-list': ^3.29.2
  '@tiptap/extension-code': ^3.29.2
  '@tiptap/extension-code-block': ^3.29.2
  '@tiptap/extension-collaboration': ^3.29.2
  '@tiptap/extension-document': ^3.29.2
  '@tiptap/extension-drag-handle': ^3.29.2
  '@tiptap/extension-drag-handle-vue-3': ^3.29.2
  '@tiptap/extension-dropcursor': ^3.29.2
  '@tiptap/extension-gapcursor': ^3.29.2
  '@tiptap/extension-hard-break': ^3.29.2
  '@tiptap/extension-heading': ^3.29.2
  '@tiptap/extension-horizontal-rule': ^3.29.2
  '@tiptap/extension-image': ^3.29.2
  '@tiptap/extension-italic': ^3.29.2
  '@tiptap/extension-link': ^3.29.2
  '@tiptap/extension-list': ^3.29.2
  '@tiptap/extension-list-item': ^3.29.2
  '@tiptap/extension-list-keymap': ^3.29.2
  '@tiptap/extension-mention': ^3.29.2
  '@tiptap/extension-node-range': ^3.29.2
  '@tiptap/extension-ordered-list': ^3.29.2
  '@tiptap/extension-paragraph': ^3.29.2
  '@tiptap/extension-placeholder': ^3.29.2
  '@tiptap/extension-strike': ^3.29.2
  '@tiptap/extension-text': ^3.29.2
  '@tiptap/extension-underline': ^3.29.2
  '@tiptap/extensions': ^3.29.2
  '@tiptap/markdown': ^3.29.2
  '@tiptap/pm': ^3.29.2
  '@tiptap/starter-kit': ^3.29.2
  '@tiptap/suggestion': ^3.29.2

shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - chokidar
  # rollup@2.80.0 is an exact pin of @crxjs/vite-plugin >=2.7; it is an
  # official maintainer backport (v2.80.0 tag in rollup/rollup, backports-2
  # dist-tag) published manually without provenance, which trips the
  # date-based check. Verified legitimate 2026-07-14.
  - rollup
  - semver
  - undici-types
