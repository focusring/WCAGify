name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build packages
        run: pnpm --filter @focusring/wcagify build && pnpm --filter create-wcagify build

      - run: pnpm nuxt prepare
        working-directory: playground

      - name: Install Horn (PDF/UA validator)
        # Horn (https://horn.report) validates the generated PDF against PDF/UA-1.
        # The pdf e2e suite invokes the `horn` CLI; it skips that check if absent.
        run: |
          curl -sL https://github.com/focusring/horn/releases/latest/download/horn-linux-x86_64 \
            -o /usr/local/bin/horn
          chmod +x /usr/local/bin/horn
          horn --version

      - name: Run E2E tests
        # The PDF e2e suite renders against the live WeasyPrint service (the same
        # one production uses); the test warms the service and retries to absorb
        # cold starts. The other e2e suites are unaffected.
        run: pnpm test:e2e
        env:
          NUXT_WEASYPRINT_URL: https://magnificent-encouragement-production.up.railway.app

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: .tmp/
          retention-days: 7
